summary: Bewild BW10 coupon WhatsApp delivery worker
description: Sends pending Bewild coupon popup WhatsApp follow-ups through
  Interakt, rotating active Shopify products and using BW10 as the first-order
  coupon.
lock: '!inline f/bewild_lead_magnet/send_coupon_delivery.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    debug_followup_id:
      type: string
      description: Optional exact follow-up id to preview or send only one row.
      default: ''
      originalType: string
    dry_run:
      type: boolean
      description: Preview pending messages without sending WhatsApp or updating
        follow-up rows.
      default: true
    limit:
      type: integer
      description: Maximum pending WhatsApp coupon follow-ups to process.
      default: 25
  required: []
