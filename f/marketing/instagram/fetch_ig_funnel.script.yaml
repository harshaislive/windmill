summary: IG funnel metrics for Beforest
description: Fetches Instagram reach, profile, follower, website click,
  engagement, and content-level metrics from the Facebook Graph API for a
  selected date window.
lock: '!inline f/marketing/instagram/fetch_ig_funnel.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    dashboard_passcode:
      type: string
      description: Dashboard passcode required for public app access.
      default: ''
      originalType: string
    end_date:
      type: string
      description: End date in YYYY-MM-DD. Defaults to today.
      default: ''
      originalType: string
    facebook_token_variable_path:
      type: string
      description: Windmill variable path containing the long-lived Facebook token.
      default: f/marketing/instagram/facebook_api_token
      originalType: string
    ig_username:
      type: string
      description: Instagram username to select from connected accounts.
      default: beforestfarming
      originalType: string
    max_media:
      type: number
      description: Maximum media items to inspect for the content leaderboard.
      default: 40
    page_name:
      type: string
      description: Facebook page name connected to the Instagram account.
      default: Beforest
      originalType: string
    start_date:
      type: string
      description: Start date in YYYY-MM-DD. Defaults to the last 10-day window.
      default: ''
      originalType: string
  required: []
