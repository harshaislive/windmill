value: '{"version":"mumbai-v1","subject":"What if water came before the home?","html":"<p><strong>Most homes begin with a building.</strong></p><p><strong>At Beforest Mumbai Collective, we started with a different question:</strong></p><p><strong>Can this land sustain life for generations to come?</strong></p><p>Water security is a 5–6 year process. It is one of the first things we are working on—not something to think about after the homes are built.</p><p>Because we don''t want to simply build on this land.</p><p>We want to understand it, regenerate it and help it thrive for generations to come.</p><p><strong>103 acres. Just 45 member homes.</strong></p><p>And the people choosing to be part of it are as important as the place itself.</p><p>The Collective is already home to people who have built businesses, led organisations, created institutions and shaped ideas—and who now want to create a different kind of wealth for themselves and their families.</p><p>People who value time, nature, community and the opportunity to leave something better than they found it.</p><p><strong>The final 10 homes are now available.</strong></p><p>If you had considered the Collective earlier, it is worth revisiting before this opportunity is gone.</p><p><strong>₹6.9 Cr + GST includes:</strong><br>• 3-acre ownership<br>• 2,400 sq. ft. Nature-compliant Earth Home designed by Biome<br>• Collective design and maintenance till 2033<br>• A rare community of like-minded people who will share the ecosystem with you</p><p><strong>Talk to us. We''ll make this happen.</strong><br>Share your availability.</p>"}'
