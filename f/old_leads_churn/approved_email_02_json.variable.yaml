value: '{"version":"mumbai-v1","subject":"What if your home came with 103 acres?","html":"<p><strong>What if the land around your home wasn''t an amenity?</strong></p><p><strong>What if it was the experience?</strong></p><p>At Beforest Mumbai Collective, we''re creating a 103-acre living landscape for just 45 member homes.</p><p>More than 80% of the land is being thoughtfully regenerated.</p><p>Your 2,400 sq. ft. Nature-compliant Earth Home, designed by Biome, sits within your 3-acre ownership.</p><p>But the experience doesn''t stop at your boundary.</p><p>The landscape is for everyone to walk through, explore, spend time in and experience together.</p><p>This isn''t a landscaped property with homes around it.</p><p>It is a landscape being regenerated, with homes carefully placed within it.</p><p>And you won''t experience it alone.</p><p>You become part of a rare community of like-minded people who share the ecosystem with you.</p><p>A place like this takes years to create.</p><p>And once these homes are gone, this particular combination of land, water, landscape and community cannot simply be recreated.</p><p><strong>There are now just 10 homes left.</strong></p><p><strong>₹6.9 Cr + GST includes:</strong><br>• 3-acre ownership<br>• 2,400 sq. ft. Nature-compliant Earth Home designed by Biome<br>• Collective design and maintenance till 2033<br>• A rare community of like-minded people who will share the ecosystem with you</p><p><strong>Talk to the team making this happen.</strong><br>Share your availability.</p>"}'
is_secret: false

