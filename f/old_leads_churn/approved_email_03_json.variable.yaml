value: '{"version":"mumbai-v1","subject":"You can''t simply create another 103 acres like this.","html":"<p><strong>The land took years to find.</strong></p><p><strong>The water systems will take 5–6 years to establish.</strong></p><p><strong>The landscape is being regenerated.</strong></p><p><strong>And the entire 103 acres is being designed for just 45 member homes.</strong></p><p>That''s what makes the Beforest Mumbai Collective difficult to replicate.</p><p>It isn''t just the home.</p><p>It''s the land.</p><p>The water.</p><p>The regenerating landscape.</p><p>The people who choose to live here.</p><p>And the opportunity to create something your family can thrive in for generations to come.</p><p>That''s what makes this more than a home.</p><p><strong>It''s legacy ownership.</strong></p><p><strong>There are only 10 homes left.</strong></p><p><strong>₹6.9 Cr + GST includes:</strong><br>• 3-acre ownership<br>• 2,400 sq. ft. Nature-compliant Earth Home designed by Biome<br>• Collective design and maintenance till 2033<br>• A rare community of like-minded people who will share the ecosystem with you</p><p>If you had looked at the Collective before, this may be the right time to take another look.</p><p><strong>Talk to the team making this happen.</strong><br>Share your availability.</p>"}'
is_secret: false

