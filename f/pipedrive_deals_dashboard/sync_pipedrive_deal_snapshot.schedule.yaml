summary: Daily Pipedrive deal snapshot
description: Fetches all current Pipedrive deals once each morning and stores
  the dashboard snapshot.
args:
  dry_run: false
  max_deals: 10000
cron_version: v2
email: harsha@beforest.co
enabled: true
is_flow: false
no_flow_overlap: true
schedule: 0 15 8 * * *
script_path: f/pipedrive_deals_dashboard/sync_pipedrive_deal_snapshot
timezone: Asia/Kolkata
ws_error_handler_muted: false
