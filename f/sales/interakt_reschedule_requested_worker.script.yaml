summary: 05D Worker - 1on1 reschedule request
description: Handles a lead clicking the WhatsApp `Reschedule Call` button.
  Cancels the owner calendar event when found, closes the stale owner-owned
  Pipedrive call activity, updates the deal label to `1on1 - Awaiting`, clears
  meeting fields, and sends the owner booking-link acknowledgement where a safe
  template/link exists. Rakesh/Sravani fallback creates a neutral manual task
  instead of sending the old Rakesh-specific booking link.
lock: '!inline f/sales/interakt_reschedule_requested_worker.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    dry_run:
      type: boolean
      default: false
    route:
      type: object
      description: Parsed router output.
      default: null
      format: resource-record
  required:
    - route
