summary: 01C Worker - map collective product to deal
description: Ensures each active collective intake deal has the matching
  Pipedrive product attached, creating the product first if it is missing, so
  deal value does not remain at 0 INR.
lock: '!inline f/sales/map_deal_product_from_collective.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    deal_id:
      type: number
      description: Pipedrive deal ID.
      default: null
    dry_run:
      type: boolean
      description: Preview product lookup/attachment without writing to Pipedrive.
      default: false
    product_answer:
      type: string
      description: Optional raw Typeform product answer for Pipedrive product comments.
      default: ''
      originalType: string
    preview_pipeline_id:
      type: number
      description: Dry-run-only pipeline override for deterministic product resolution tests without a deal write.
      default: 0
    provision_products:
      type: boolean
      description: Create the four versioned August 2026 pricing products without attaching them to a deal.
      default: false
  required:
    - deal_id
