summary: 02B Guard - label-triggered 1on1/GIS next step
description: Receives Pipedrive deal-change webhooks after intake or manual CRM
  updates. If the deal has label `1on1 - TBC`, is in an Initial Event Scheduled
  stage, and has no meeting date or meeting URL, it sends the team scheduling
  notice instead of prebooking a calendar slot. If the deal has label `GIS
  Awaiting`, it sends the GIS StoryMap CTA. Otherwise it safely returns ignored.
lock: '!inline f/sales/pipedrive_1on1_tbc_to_calendar_prebook.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    body:
      type: object
      description: Pipedrive webhook payload.
      default: null
    dry_run:
      type: boolean
      description: Check eligibility and preview the WhatsApp notice without sending it.
      default: false
  required:
    - body
tag: sales-webhook
