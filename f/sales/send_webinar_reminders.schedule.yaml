summary: 08Z DISABLED DO NOT ENABLE - webinar reminder fallback poller
description: Disabled legacy fallback poller. The live webinar reminder path is
  one-off jobs scheduled by f/sales/create_webinar_activity_from_calendly after
  Zoom registration and Pipedrive webinar activity creation. Do not enable this
  schedule unless one-off jobs are not being created and broad fallback polling
  has been explicitly approved; the script also requires fallback_enabled=true
  before broad non-dry-run polling can send reminders.
args:
  dry_run: false
  fallback_enabled: false
  max_deals: 500
  max_late_minutes: 60
  timezone: Asia/Kolkata
cron_version: v2
email: harsha@beforest.co
enabled: false
is_flow: false
no_flow_overlap: true
schedule: 0 */15 * * * *
script_path: f/sales/send_webinar_reminders
timezone: Asia/Kolkata
ws_error_handler_muted: false
