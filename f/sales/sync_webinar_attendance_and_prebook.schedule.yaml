summary: 13B Schedule - reconcile webinar attendance from Zoom
description: Safety-net reconciliation for recent completed collective webinars.
  The primary path is one-off attendance jobs scheduled from the Calendly to
  Zoom/Pipedrive worker; this fallback runs every 3 hours and only checks recent
  completed Zoom meetings. Live updates use Zoom registrant IDs by default, not
  email-only matches.
args:
  allow_email_fallback: false
  dry_run: false
  max_deals: 2000
  max_meetings: 12
  min_duration_seconds: 300
  mode: sync_attendance
  prebook_delay_hours: 24
  recent_completed_days: 7
  schedule_prebook: true
  skip_test_deals: true
cron_version: v2
email: harsha@beforest.co
enabled: false
is_flow: false
no_flow_overlap: true
schedule: 0 0 */3 * * *
script_path: f/sales/sync_webinar_attendance_and_prebook
timezone: Asia/Kolkata
ws_error_handler_muted: false
