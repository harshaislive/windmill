summary: Supabase self-hosted - nightly encrypted DB backup to Dropbox
description: Full pg_dump + roles + row counts of the self-hosted Supabase, age-encrypted, to Dropbox /Backups/supabase/db/<date>/. Keeps 30 days. Emails harsha@beforest.co on failure.
args:
  mode: db
  keep_days: 30
cron_version: v2
email: harsha@beforest.co
enabled: true
is_flow: false
no_flow_overlap: true
schedule: 0 30 2 * * *
script_path: f/supabase/backup_selfhosted
timezone: Asia/Kolkata
ws_error_handler_muted: false
